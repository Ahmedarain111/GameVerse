{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVerse - {%block title %}{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="icon" href="{% static 'images/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@100..900&family=Orbitron:wght@400..900&family=Poppins:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">


<style>
    body {
        font-family: 'Exo 2', 'Poppins', 'Roboto', sans-serif;
        min-height: 100vh;
        background: linear-gradient(140deg, #0b0b0b, #1a1a1a);
        background: linear-gradient(90deg, #E82285, #4F2F8F);
    }

    h1, h2, h3, h4, h5, h6 {
        font-family: 'Orbitron', 'Exo 2', 'Poppins', 'Roboto', sans-serif;
    }

    label {
        color: white
    }

    .form {
        background: linear-gradient(-135deg, #272727ff, #1a1a1a);
        padding: 10px;
        max-width: 400px;
        width: 100%;
        box-shadow: 4px 8px 25px #090909aa;
        border: 2px solid;
        {% comment %} border-image: linear-gradient(90deg, #E82285, #4F2F8F) 1; {% endcomment %}
    }

    .custom-input {
        background: #091728ff;
        color: #DCDCDC;
        border: 1px solid #1d3557;
        border-radius: 8px;
        outline: none;
        transition: transform 0.4s ease, border-color 0.2s ease;
    }

    .custom-input:focus {
        border-color: #512F8F;
        transform: scale(1.01);
    }

.btn {
    background: linear-gradient(90deg, #E82285, #4F2F8F);
    color: #DCDCDC;
    font-weight: 600;
    padding: 6px;
    border: none;    
}

.btn:hover {
    transform: translateY(-2px);
    color: #DCDCDC;
    transition: all 0.2s ease-in-out !important;
}

.btn:active {
    transform: translateY(1px);
    color: #DCDCDC !important;
}

    @media (max-width: 576px) {
        .form {
            max-width: 100%;
            height: 100vh;
            border-radius: 0;
            padding: 10px
        }
        .form img {
            width: 25%;
            min-width: 50px;
        }
    }
</style>
</head>
<body>
    <main class="container-fluid p-0 d-flex justify-content-center align-items-center vh-100">
        <div class="form  rounded p-4 d-flex flex-column justify-content-center align-items-center" style="max-width: 400px;">
            <img src="{% static 'images/logo.png' %}" alt="Gameverse" class="w-25">
            <h5 class="mt-3 mb-4 text-center" style="color: #DCDCDC">Welcome to GameVerse!</h5>
            {% block content %}{% endblock content %} 
            
            {% if request.resolver_match.url_name == 'signup' %}
                <p class="text-light m-4">Already have an account? <a href="{% url "users:login" %}">Log in</a></p>
            {% else %}
                <p class="text-light m-4">Don't have an account? <a href="{% url "users:signup" %}">Signup</a></p>
            {% endif %}
        </div>
    </main>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
