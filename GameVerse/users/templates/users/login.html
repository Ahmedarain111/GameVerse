{% extends 'auth_base.html' %}

{% block title %}Login{% endblock title %}

{% block content %}
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group mb-3">
                {{ field.label_tag }}

                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" value="{{ field.value|default:'' }}"
                    class="form-control custom-input {% if field.errors %}is-invalid{% endif %}"
                    placeholder="{{ field.field.widget.attrs.placeholder }}">
                {% if field.errors %}
                    <small class="text-danger">{{ field.errors.0 }}</small>
                {% endif %}
            </div>
        {% endfor %}

        <button class="btn w-100">Login</button>
    </form>

{% endblock content %}
