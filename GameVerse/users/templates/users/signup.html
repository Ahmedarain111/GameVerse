{% extends 'auth_base.html' %}
{% block title %}Sign Up{% endblock title %}

{% block content %} 
<form method="POST">
    {% csrf_token %}

    {% for field in form %}
    <div class="form-group mb-3">
        {{ field.label_tag}}
        {{ field}}
        <small class="text-danger">{{ field.errors }}</small>
    </div>
    {% endfor %}
    <button class="btn w-100">Sign up</button>
</form>
{% endblock content %}
